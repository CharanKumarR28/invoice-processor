# ===========================
# Test Configuration (H2 in-memory DB)
# ===========================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Dummy AWS config for tests (S3Client is mocked)
aws.region=ap-south-1
aws.s3.input-bucket=test-input-bucket
aws.s3.output-bucket=test-output-bucket
aws.accessKeyId=test-key
aws.secretKey=test-secret

# Async config
async.core-pool-size=2
async.max-pool-size=4
async.queue-capacity=10
